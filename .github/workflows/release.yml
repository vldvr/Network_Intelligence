name: Release

# Push a tag like v1.1.0: tests run, wheel and sdist are built and attached
# to a GitHub Release with generated notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }

      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "NetworkIntelligence $GITHUB_REF_NAME" --generate-notes
