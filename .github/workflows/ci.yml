name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # No extras: the suite must pass with none of the optional backends
          # installed. That is the property the port/adapter split buys, so it
          # is worth testing rather than assuming.
          pip install -e ".[dev]"

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff (lint)
        run: ruff check netintel tests
      - name: ruff (format)
        run: ruff format --check netintel tests

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # No optional extras: the type check runs against the same surface the
      # test job does, and the GUI layer's Qt-specific relaxations are pinned
      # in pyproject rather than depending on which stubs happen to be present.
      - run: pip install -e ".[dev]"
      - run: mypy

  smoke:
    name: smoke (installed console script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: The CLI must work with no optional dependency installed
        run: |
          netintel --version
          netintel scope
          netintel capture --print-filter --protocol tcp --dst-port 443
      - name: Scanning outside the authorised scope must fail closed
        run: |
          if netintel --offline discover 1.1.1.1; then
            echo "::error::a public target was accepted without authorisation"
            exit 1
          fi
