[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netintel"
version = "1.0.0"
description = "Network diagnostics toolkit: traceroute, geolocation, host discovery and packet capture, with a CLI and a Qt front end."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["network", "traceroute", "geoip", "packet-capture", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

# The base install has no dependencies at all: `netintel scope`, target
# parsing and BPF compilation work on a bare interpreter. Everything that
# needs a library is an extra, so a user installs only what they will use.
dependencies = []

[project.optional-dependencies]
geo = ["requests>=2.31"]
capture = ["scapy>=2.5"]
nmap = ["python-nmap>=0.7.1"]
gui = ["PyQt5>=5.15"]
all = ["requests>=2.31", "scapy>=2.5", "python-nmap>=0.7.1", "PyQt5>=5.15"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
netintel = "netintel.cli.main:main"

[project.gui-scripts]
netintel-gui = "netintel.ui.app:run"

[project.urls]
Homepage = "https://github.com/vldvr/network_intelligence"
Issues = "https://github.com/vldvr/network_intelligence/issues"

[tool.setuptools.packages.find]
include = ["netintel*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["netintel"]
omit = ["netintel/ui/*"]  # exercised by hand; not covered by the headless suite

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplification
    "RUF",
]
ignore = [
    "B008",   # function calls in argument defaults — deliberate for dataclasses
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["netintel"]
strict = true
warn_unreachable = true
# The optional backends ship without type information; the adapters that wrap
# them are the only place untyped objects are allowed to appear.
[[tool.mypy.overrides]]
module = ["scapy.*", "nmap.*", "requests.*", "PyQt5.*"]
ignore_missing_imports = true

# Qt ships no usable type information for the parts used here, so the GUI
# layer relaxes exactly the rules that an untyped base class trips — and
# nothing else. `core` stays fully strict.
[[tool.mypy.overrides]]
module = ["netintel.ui.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false
